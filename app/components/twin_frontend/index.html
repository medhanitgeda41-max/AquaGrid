      new THREE.CylinderGeometry(0.36, 0.36, 4.6, 10),
      new THREE.MeshStandardMaterial({ color: '#94A3B8', metalness: 0.7, roughness: 0.3 })
    );
    outPipe.rotation.z = Math.PI / 2;
    outPipe.position.set(R + 1.4, 1.15, zOff);
    outPipe.userData.tooltip = `<strong>RES-01 City Outlet #${idx + 1}</strong><br/>Feeds main transmission trunks to Sectors 1-6.`;
    g.add(outPipe);
    engine.hoverables.push(outPipe);
  });

  engine.scene.add(g);

  // Labels for tank + inner marker rings
  const initRateStr = res.rate_str ? ` ${res.rate_str}` : '';
  const initEtaStr = res.floor_eta_str ? ` · ${res.floor_eta_str}` : '';
  const resLbl = registerLabel(`RES-01 · ${Number(res.level_percent || 48).toFixed(1)}%${initRateStr}${initEtaStr}`, new THREE.Vector3(rx, H + 2.0, rz), 'ag-label', '#0EA5E9');
  const floorLbl = registerLabel('35% Floor (Red) · +5% Warn (Yellow)', new THREE.Vector3(rx + R + 1.2, 0.4 + H * 0.38, rz), 'ag-label ag-label-part', '#EF4444');
  const dynLbl = registerLabel('Dynamic Floor', new THREE.Vector3(rx - R - 0.8, 0.4 + H * 0.36, rz), 'ag-label ag-label-warn');
  dynLbl.visible = false;
  dynLbl.el.style.display = 'none';

  glassWall.userData.selectInfo = {
    target_type: 'reservoir',
    target_id: 'RES-01',
    focus: 'reservoir_inside',
    suggestion: 'Show reservoir trend and status for RES-01'
  };

  engine.resRig = {
    group: g, R, H, rx, rz,
    glassWall, glassMat, waterBody, waterMat, waterSurface, surfMat,
    currentRing, baseFloorRing, dynamicFloorRing, warningFloorRing,
    resLbl, floorLbl, dynLbl,
    prevPct: Number(res.level_percent || 48),
    targetPct: Number(res.level_percent || 48),
    currentPct: Number(res.level_percent || 48),
    baseFloorPct: Number(res.base_floor_percent || 35),
    dynFloorPct: Number(res.safety_floor_percent || 35),
    warnFloorPct: Number(res.warning_floor_percent || 40),
    rateStr: res.rate_str || '',
    floorEtaStr: res.floor_eta_str || '',
    hasEmergency: !!res.has_active_emergency,
    animStart: 0
  };
}

function buildPipesAndParticles(state, lowQ) {
  const S = engine.scale;
  const scene = engine.scene;
  const flangeMat = new THREE.MeshStandardMaterial({ color: '#CBD5E1', metalness: 0.82, roughness: 0.24 });
  const fittingMat = new THREE.MeshStandardMaterial({ color: '#E2E8F0', metalness: 0.80, roughness: 0.24 });
  const reducerMat = new THREE.MeshStandardMaterial({ color: '#CBD5E1', metalness: 0.84, roughness: 0.20 });
  const elbowMat = new THREE.MeshStandardMaterial({ color: '#94A3B8', metalness: 0.78, roughness: 0.24 });

  engine.flowTracks = [];
  engine.pipeMap = {};
  engine.pipesByRun = {};

  const connNet = state.connected_network || {};
  const pipeList = (connNet.pipes && connNet.pipes.length) ? connNet.pipes : (state.pipes || []);
  const fittingsList = connNet.fittings || [];
  const reducersList = connNet.reducers || [];

  const elbowCoords = [];

  pipeList.forEach(pipe => {
    const pCls = pipe.pipe_class || (pipe.is_trunk ? 'SECTOR_TRUNK' : 'DISTRIBUTION');
    const role = pipe.role || (pCls === 'TRUNK_MAIN' ? 'trunk_main' : (pCls === 'SECTOR_TRUNK' ? 'sector_trunk' : 'distribution'));
    const pipeY = Number(pipe.y_level !== undefined ? pipe.y_level : (pCls === 'TRUNK_MAIN' ? 2.00 : (pCls === 'SECTOR_TRUNK' ? 1.15 : 0.50)));
    const radius = Number(pipe.radius_3d !== undefined ? pipe.radius_3d : (pCls === 'TRUNK_MAIN' ? 0.46 : (pCls === 'SECTOR_TRUNK' ? 0.30 : 0.18)));

    const pts = (pipe.points_xz || []).map(p => new THREE.Vector3(p[0] * S, pipeY, p[1] * S));
    if (pts.length < 2) return;

    // Crisp orthogonal straight-segment CurvePath (strictly axis-aligned street segments + 90° elbows)
    const curve = new THREE.CurvePath();
    for (let i = 0; i < pts.length - 1; i++) {
      if (pts[i].distanceTo(pts[i + 1]) > 0.01) {
        curve.add(new THREE.LineCurve3(pts[i], pts[i + 1]));
      }
    }
    if (curve.curves.length === 0) return;

    // Collect intermediate 90° elbow joints sized strictly to this pipe's diameter
    for (let i = 1; i < pts.length - 1; i++) {
      elbowCoords.push({ pos: pts[i], r: radius * 1.24 });
    }

    // Color strictly by standardized 3-class palette: TRUNK_MAIN #1D4ED8, SECTOR_TRUNK #2563EB, DISTRIBUTION #38BDF8
    const classDefaultHex = pCls === 'TRUNK_MAIN' ? '#1D4ED8' : (pCls === 'SECTOR_TRUNK' ? '#2563EB' : '#38BDF8');
    const activeColor = new THREE.Color(pipe.color || classDefaultHex);
    const dryColor = new THREE.Color('#475569');
    const flowVal = Number(pipe.flow_lps || 0);

    const mat = new THREE.MeshStandardMaterial({
      color: flowVal <= 0.05 ? dryColor.clone() : activeColor.clone(),
      metalness: 0.62,
      roughness: 0.28,
      transparent: true,
      opacity: 0.96
    });
    const tubularSegs = Math.max(8, Math.min(32, (pts.length - 1) * 8));
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, tubularSegs, radius, 10, false), mat);
    tube.castShadow = !lowQ && (pCls !== 'DISTRIBUTION');
    const runId = pipe.run_id || pipe.segment_id || pipe.pipe_id;
    tube.userData.pipeRunId = runId;
    scene.add(tube);
    engine.hoverables.push(tube);

    // Metallic flange rings sized strictly to this pipe's radius
    const totalLen = curve.getLength();
    if (totalLen > 2.8) {
      const flangeTubeR = Math.max(0.032, radius * 0.16);
      const flangeUs = totalLen > 12.0 ? [0.12, 0.5, 0.88] : [0.2, 0.8];
      for (const u of flangeUs) {
        const pPos = curve.getPointAt(u);
        const tan = curve.getTangentAt(u);
        const flange = new THREE.Mesh(new THREE.TorusGeometry(radius * 1.18, flangeTubeR, 6, 12), flangeMat);
        flange.position.copy(pPos);
        flange.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan.normalize());
        scene.add(flange);
      }
    }

    const keyId = pipe.pipe_id || pipe.segment_id;
    const maxParticles = lowQ ? (pCls === 'TRUNK_MAIN' ? 4 : 2) : (pCls === 'TRUNK_MAIN' ? 7 : (pCls === 'SECTOR_TRUNK' ? 5 : 3));
    const arrowCount = totalLen > 14.0 ? 3 : (totalLen > 5.0 ? 2 : 1);
    const tr = {
      pipe_id: keyId,
      segment_id: pipe.segment_id || keyId,
      run_id: runId,
      pipe_class: pCls,
      class_label: pipe.class_label || (pCls === 'TRUNK_MAIN' ? 'Trunk Main' : (pCls === 'SECTOR_TRUNK' ? 'Sector Trunk' : 'Distribution')),
      diameter_mm: Number(pipe.diameter_mm || (pCls === 'TRUNK_MAIN' ? 900 : (pCls === 'SECTOR_TRUNK' ? 500 : 200))),
      sector: pipe.sector || 'Network',
      from_node: pipe.from_node || '',
      to_node: pipe.to_node || '',
      role,
      radius,
      pipeY,
      curve,
      mat,
      tube,
      activeColor,
      dryColor,
      baseOpacity: 0.96,
      baseEmissive: new THREE.Color('#000000'),
      baseEmissiveIntensity: 0.0,
      isDimmed: false,
      prevFlow: flowVal,
      targetFlow: flowVal,
      currentFlow: flowVal,
      animStart: 0,
      delay: 0,
      particles: Array.from({ length: maxParticles }, (_, i) => ({ phase: i / maxParticles })),
      arrows: Array.from({ length: arrowCount }, (_, i) => ({ phase: (i + 0.5) / arrowCount }))
    };
    engine.pipeMap[keyId] = tr;
    if (!engine.pipesByRun[runId]) engine.pipesByRun[runId] = [];
    engine.pipesByRun[runId].push(tr);
    engine.flowTracks.push(tr);
  });

  // Real Metallic Junction Fittings (T-piece / Cross + vertical risers joining multi-elevation nodes) + small junction labels
  fittingsList.forEach(fit => {
    const fx = fit.pos_xz[0] * S;
    const fz = fit.pos_xz[1] * S;
    const yMin = Number(fit.y_min || 0.5);
    const yMax = Number(fit.y_max || yMin);
    const yMid = 0.5 * (yMin + yMax);
    const r = Number(fit.radius_3d || 0.30);
    const fType = fit.fitting_type || 'inline';

    const fGroup = new THREE.Group();
    fGroup.position.set(fx, 0, fz);

    // Core vertical manifold / riser joining all incident pipe elevations seamlessly
    const spanH = Math.max(r * 2.2, (yMax - yMin) + r * 2.0);
    const coreCyl = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.18, r * 1.18, spanH, 12), fittingMat);
    coreCyl.position.y = yMid;
    fGroup.add(coreCyl);

    // Real T-piece or Cross fitting horizontal arms sized to the junction radius
    if (fType === 'tee' || fType === 'cross') {
      const armLen = r * 4.4;
      const armX = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.08, r * 1.08, armLen, 10), fittingMat);
      armX.rotation.z = Math.PI / 2;
      armX.position.y = yMax;
      fGroup.add(armX);
      const armZ = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.08, r * 1.08, fType === 'cross' ? armLen : armLen * 0.72, 10), fittingMat);
      armZ.rotation.x = Math.PI / 2;
      armZ.position.y = yMin;
      fGroup.add(armZ);
    }

    coreCyl.userData.tooltip = `<strong>Junction ${fit.node_id}</strong> (${fit.sector || 'Network'})<br/>Fitting: <strong>${fType.toUpperCase()}</strong> (${fit.degree} pipes)`;
    engine.hoverables.push(coreCyl);
    scene.add(fGroup);

    // Compact junction label (e.g. J-14) visible when zoomed in so overview remains crisp
    if (fit.label && (fit.kind === 'junction' || fit.kind === 'trunk_hub')) {
      registerLabel(fit.label, new THREE.Vector3(fx, yMax + r + 1.35, fz), 'ag-label ag-label-junc', null, 95);
    }
  });

  // Tapered Reducer Cones at EVERY pipe class change (e.g. 900mm -> 500mm -> 200mm; thick pipe NEVER touches thin directly!)
  const upAxis = new THREE.Vector3(0, 1, 0);
  reducersList.forEach(red => {
    const rx = red.pos_xz[0] * S;
    const rz = red.pos_xz[1] * S;
    const fromR = Number(red.from_radius || 0.46);
    const toR = Number(red.to_radius || 0.30);
    const fromY = Number(red.from_y || 2.0);
    const toY = Number(red.to_y || 1.15);
    const dx = Number((red.dir_xz && red.dir_xz[0]) || 1.0);
    const dz = Number((red.dir_xz && red.dir_xz[1]) || 0.0);

    const horizLen = Math.max(1.25, fromR * 3.1);
    const pStart = new THREE.Vector3(rx, fromY, rz);
    const pEnd = new THREE.Vector3(rx + dx * horizLen, toY, rz + dz * horizLen);
    const diff = new THREE.Vector3().subVectors(pEnd, pStart);
    const coneLen = Math.max(0.6, diff.length());
    const mid = new THREE.Vector3().addVectors(pStart, pEnd).multiplyScalar(0.5);
    const dir = diff.clone().normalize();

    // CylinderGeometry(radiusTop, radiusBottom, height): bottom is at pStart (big fromR), top is at pEnd (smaller toR)
    const cone = new THREE.Mesh(new THREE.CylinderGeometry(toR * 1.06, fromR * 1.06, coneLen, 14), reducerMat);
    cone.position.copy(mid);
    cone.quaternion.setFromUnitVectors(upAxis, dir);
    cone.userData.tooltip = `<strong>Tapered Reducer</strong> at <strong>${red.node_id}</strong><br/>${red.from_diameter_mm} mm &rarr; ${red.to_diameter_mm} mm (${red.pipe_id})`;
    scene.add(cone);
    engine.hoverables.push(cone);

    // Matching metallic flange collars at both ends of the reducer cone
    const bigCollar = new THREE.Mesh(new THREE.TorusGeometry(fromR * 1.16, Math.max(0.04, fromR * 0.16), 6, 12), flangeMat);
    bigCollar.position.copy(pStart);
    bigCollar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
    scene.add(bigCollar);

    const smallCollar = new THREE.Mesh(new THREE.TorusGeometry(toR * 1.16, Math.max(0.032, toR * 0.16), 6, 12), flangeMat);
    smallCollar.position.copy(pEnd);
    smallCollar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
    scene.add(smallCollar);
  });

  // Instanced 90° pipe elbows sized strictly to each pipe's diameter
  if (elbowCoords.length > 0) {
    const elbowGeo = new THREE.SphereGeometry(1.0, 10, 8);
    const elbowInst = new THREE.InstancedMesh(elbowGeo, elbowMat, elbowCoords.length);
    const dummy = new THREE.Object3D();
    elbowCoords.forEach((eb, idx) => {
      dummy.position.copy(eb.pos);
      dummy.scale.setScalar(eb.r);
      dummy.updateMatrix();
      elbowInst.setMatrixAt(idx, dummy.matrix);
    });
    elbowInst.instanceMatrix.needsUpdate = true;
    scene.add(elbowInst);
  }

  // Small semi-transparent light-cyan water particles (~1/4 of pipe diameter — NO big white balls!)
  const totalParticles = engine.flowTracks.reduce((a, t) => a + t.particles.length, 0);
  if (totalParticles > 0) {
    engine.flowInst = new THREE.InstancedMesh(
      new THREE.SphereGeometry(1.0, 8, 8),
      new THREE.MeshBasicMaterial({ color: '#67E8F9', transparent: true, opacity: 0.72, depthWrite: false }),
      totalParticles
    );
    scene.add(engine.flowInst);
  }

  // Flow direction arrows (cones aligned strictly from_node -> to_node along every active pipe)
  const totalArrows = engine.flowTracks.reduce((a, t) => a + t.arrows.length, 0);
  if (totalArrows > 0) {
    engine.arrowInst = new THREE.InstancedMesh(
      new THREE.ConeGeometry(1.0, 2.3, 8),
      new THREE.MeshBasicMaterial({ color: '#E0F2FE', transparent: true, opacity: 0.90 }),
      totalArrows
    );
    scene.add(engine.arrowInst);
  }
}

function buildValves(state) {
  const S = engine.scale;
  const scene = engine.scene;
  const bodyMat = new THREE.MeshStandardMaterial({ color: '#64748B', metalness: 0.75, roughness: 0.3 });

  (state.valves || []).forEach(v => {
    const vx = v.pos_xz[0] * S, vz = v.pos_xz[1] * S;
    const isOpen = String(v.status).toUpperCase() === 'OPEN';
    const col = new THREE.Color(isOpen ? '#22C55E' : '#EF4444');
    const pipeR = Number(v.pipe_radius_3d || 0.30);
    const pipeY = Number(v.pipe_y_level || 1.15);
    const vScale = Math.max(0.65, Math.min(1.45, pipeR / 0.30));

    const group = new THREE.Group();
    group.position.set(vx, pipeY, vz);
    if (v.pipe_dir_xz && v.pipe_dir_xz.length === 2) {
      group.rotation.y = -Math.atan2(v.pipe_dir_xz[1], v.pipe_dir_xz[0]);
    }
    group.scale.setScalar(vScale);

    // Metallic valve body housing + twin pipe flange collars + stem sized to host pipe
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.85, 12), bodyMat);
    group.add(body);
    const fCollarL = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.06, 6, 12), bodyMat);
    fCollarL.rotation.y = Math.PI / 2;
    fCollarL.position.x = -0.45;
    group.add(fCollarL);
    const fCollarR = fCollarL.clone();
    fCollarR.position.x = 0.45;
    group.add(fCollarR);

    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.82, 8), bodyMat);
    stem.position.y = 0.68;
    group.add(stem);

    // Handwheel (torus + spokes)
    const wheelGroup = new THREE.Group();
    const wheelMat = new THREE.MeshStandardMaterial({
      color: col.clone(),
      emissive: col.clone(),
      emissiveIntensity: 0.38,
      metalness: 0.45,
      roughness: 0.28
    });
    const wheelRing = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.13, 10, 20), wheelMat);
    wheelRing.rotation.x = Math.PI / 2;
    wheelGroup.add(wheelRing);
    wheelGroup.add(new THREE.Mesh(new THREE.BoxGeometry(1.18, 0.09, 0.09), wheelMat));
    wheelGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.09, 1.18), wheelMat));
    wheelGroup.position.y = 1.08;
    group.add(wheelGroup);

    const hit = new THREE.Mesh(
      new THREE.SphereGeometry(1.35, 8, 8),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.0, depthWrite: false })
    );
    hit.position.y = 0.72;
    hit.userData.selectInfo = {
      target_type: 'valve',
      target_id: v.valve_id,
      focus: v.valve_id,
      suggestion: `Tell me about valve ${v.valve_id}`
    };
    group.add(hit);
    engine.hoverables.push(hit);

    scene.add(group);
    const lblRec = registerLabel(v.valve_id, new THREE.Vector3(vx, pipeY + 1.95 * vScale, vz), 'ag-label ag-label-valve', isOpen ? '#22C55E' : '#EF4444', 115);
    lblRec.alwaysShow = !isOpen;
    engine.valveMap[v.valve_id] = {
      group, wheelGroup, wheelMat, hit, lblRec,
      status: isOpen ? 'OPEN' : 'CLOSED',
      anim: null,
      rejectFlashUntil: 0
    };
  });
}

function buildSensors(state) {
  const S = engine.scale;
  const scene = engine.scene;
  (state.sensors || []).forEach(s => {
    const sx = s.pos_xz[0] * S, sz = s.pos_xz[1] * S;
    const mat = new THREE.MeshStandardMaterial({ color: '#38BDF8', emissive: '#0EA5E9', emissiveIntensity: 0.95 });
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 10), mat);
    mesh.position.set(sx, 1.65, sz);
    scene.add(mesh);
    engine.hoverables.push(mesh);

    const warnLbl = registerLabel(`⚠ ${s.sensor_id}`, new THREE.Vector3(sx, 2.9, sz), 'ag-label ag-label-warn');
    warnLbl.visible = false;
    warnLbl.el.style.display = 'none';
    engine.sensorMap[s.sensor_id] = { mesh, mat, warnLbl };
  });
}

function syncLeaks(state, lowQ) {
  const S = engine.scale;
  const scene = engine.scene;
  const now = engine.clock.getElapsedTime();
  const seen = new Set();

  (state.leaks || []).forEach(lk => {
    const lid = lk.leak_id;
    const jid = lk.junction_id || '';
    const stCode = String(lk.status || 'CONFIRMED').toUpperCase();
    const isHistory = !!lk.is_history || stCode === 'RESOLVED' || stCode === 'FALSE_ALARM';
    const isIsolated = !!lk.isolated;
    const isConfirmed = stCode === 'CONFIRMED';
    const isSuspected = stCode === 'SUSPECTED';
    const isRepair = stCode === 'UNDER_REPAIR';
    // Spray runs ONLY for active non-isolated CONFIRMED (full) or SUSPECTED (subtle); UNDER_REPAIR has NO spray if isolated; history has NO spray
    const hasSpray = (!isHistory && !isIsolated) && (isConfirmed || isSuspected || isRepair);
    const isPulsing = (!isHistory && !isIsolated) && (isConfirmed || isSuspected);

    seen.add(lid);
    let rec = engine.leakMap[lid];

    if (!rec) {
      const lx = lk.pos_xz[0] * S, lz = lk.pos_xz[1] * S;
      const ly = Number(lk.y_level || 1.15) + 0.48;
      const group = new THREE.Group();
      const coreMat = new THREE.MeshStandardMaterial({ color: '#EF4444', emissive: '#DC2626', emissiveIntensity: 1.0 });
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.88, 14, 14), coreMat);
      core.position.set(lx, ly, lz);
      group.add(core);
      engine.hoverables.push(core);

      const ringMat = new THREE.MeshBasicMaterial({ color: '#EF4444', transparent: true, opacity: 0.8, side: THREE.DoubleSide });
      const ring = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.85, 24), ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(lx, 0.25, lz);
      group.add(ring);

      const puddleMat = new THREE.MeshBasicMaterial({ color: '#0EA5E9', transparent: true, opacity: 0.5, side: THREE.DoubleSide });
      const puddle = new THREE.Mesh(new THREE.CircleGeometry(2.7, 24), puddleMat);
      puddle.rotation.x = -Math.PI / 2;
      puddle.position.set(lx, 0.16, lz);
      group.add(puddle);

      const dropCount = lowQ ? 8 : 18;
      const dropGeo = new THREE.SphereGeometry(0.16, 6, 6);
      const dropMat = new THREE.MeshBasicMaterial({ color: '#7DD3FC', transparent: true, opacity: 0.90 });
      const sprayDrops = [];
      for (let i = 0; i < dropCount; i++) {
        const mesh = new THREE.Mesh(dropGeo, dropMat);
        mesh.position.set(lx, 1.4, lz);
        group.add(mesh);
        sprayDrops.push({ mesh, ang: (i / dropCount) * Math.PI * 2 + (i % 3) * 0.22, speed: 1.6 + (i % 4) * 0.45, offset: i / dropCount });
      }
      scene.add(group);
      const lblRec = registerLabel(`${lid}`, new THREE.Vector3(lx, 4.1, lz), 'ag-label ag-label-danger');
      rec = { lx, lz, group, core, coreMat, ring, ringMat, puddle, puddleMat, sprayDrops, lblRec, isActive: hasSpray, isPulsing, sprayScale: 1.0, isolatedAt: null };
      engine.leakMap[lid] = rec;
    }

    if (rec.isActive && !hasSpray) {
      rec.isolatedAt = now;
    } else if (hasSpray) {
      rec.isolatedAt = null;
    }
    rec.isActive = hasSpray;
    rec.isPulsing = isPulsing;
    rec.sprayScale = isConfirmed ? 1.0 : (isSuspected ? 0.55 : 0.45);

    // Status-based colors & icons (CONFIRMED = red pulsing + spray; SUSPECTED = orange; UNDER_REPAIR = yellow + wrench; RESOLVED/FALSE_ALARM = grey)
    let hexColor = '#EF4444';
    let bgCss = 'rgba(220,38,38,0.94)';
    let badgeTxt = `🚨 ${lid} (${jid})`;
    if (isHistory) {
      hexColor = '#94A3B8';
      bgCss = 'rgba(71,85,105,0.88)';
      badgeTxt = `${lid} (${stCode})`;
      rec.puddle.visible = false;
      rec.ring.visible = false;
    } else if (isRepair) {
      hexColor = '#EAB308';
      bgCss = 'rgba(202,138,4,0.94)';
      badgeTxt = isIsolated ? `🔧 ${lid} (${jid} · ISOLATED)` : `🔧 ${lid} (${jid} · REPAIR)`;
      rec.puddle.visible = !isIsolated;
      rec.ring.visible = true;
    } else if (isSuspected) {
      hexColor = '#F97316';
      bgCss = 'rgba(234,88,12,0.94)';
      badgeTxt = isIsolated ? `⚠ ${lid} (${jid} · ISOLATED)` : `⚠ ${lid} (${jid} · SUSPECTED)`;
      rec.puddle.visible = !isIsolated;
      rec.ring.visible = true;
    } else {
      hexColor = isIsolated ? '#22C55E' : '#EF4444';
      bgCss = isIsolated ? 'rgba(22,163,74,0.92)' : 'rgba(220,38,38,0.94)';
      badgeTxt = isIsolated ? `✓ ${lid} (${jid} · ISOLATED)` : `🚨 ${lid} (${jid})`;
      rec.puddle.visible = true;
      rec.ring.visible = !isIsolated;
    }

    rec.coreMat.color.set(hexColor);
    rec.coreMat.emissive.set(hexColor);
    rec.coreMat.emissiveIntensity = isHistory ? 0.15 : (isIsolated ? 0.35 : 0.95);
    rec.ringMat.color.set(hexColor);

    rec.core.userData.selectInfo = {
      target_type: 'leak',
      target_id: lid,
      focus: lid,
      suggestion: `Tell me about ${lid}`
    };
    const updTxt = lk.updated_at ? `<br/>Last update: ${lk.updated_at}` : '';
    const vTxt = lk.isolating_valve_id ? ` · Valve: ${lk.isolating_valve_id} (${lk.valve_status || 'OPEN'})` : '';
    rec.core.userData.tooltip = `<strong>${lid}</strong> · Junction <strong>${jid}</strong> (${lk.sector})<br/>Status: <strong>${stCode}</strong>${isIsolated && !isHistory ? ' (ISOLATED)' : ''}${vTxt}<br/>Loss: <strong>${lk.estimated_loss_m3_per_hour} m³/hr</strong>${updTxt}`;
    rec.lblRec.el.textContent = badgeTxt;
    rec.lblRec.el.style.background = bgCss;
    rec.lblRec.el.style.color = isRepair ? '#0F172A' : '#F8FAFC';
    rec.lblRec.visible = true;
    rec.group.visible = true;
  });

  // Hide removed / resolved leaks (e.g., when resolved or after DB reset)
  for (const [lid, rec] of Object.entries(engine.leakMap)) {
    if (!seen.has(lid)) {
      rec.isActive = false;
      rec.group.visible = false;
      rec.lblRec.visible = false;
      rec.lblRec.el.style.display = 'none';
    } else {
      rec.group.visible = true;
    }
  }
}

// ── In-Place State Update (runs on EVERY Streamlit rerun with ZERO reload!) ──
function applySceneUpdate(args) {
  const state = args.scene_state || {};
  const viewCmd = args.view_command || {};
  const quality = args.quality || (state.low_quality ? 'Low' : 'High');
  const followChat = args.follow_chat !== false;
  const lowQ = quality === 'Low';

  if (!engine.initialized) {
    initEngine(state, quality);
  }

  const now = engine.clock.getElapsedTime();
  const S = engine.scale;

  // Apply-only-changes optimization: skip redundant visual updates when scene_hash, quality, and viewCmd.seq are unchanged
  const incomingHash = state.scene_hash || state.scene_version || '';
  const incomingSeq = Number(viewCmd.seq || 0);
  if (
    engine.lastSceneHash &&
    incomingHash &&
    engine.lastSceneHash === incomingHash &&
    engine.lastQuality === quality &&
    engine.lastCommandSeq === incomingSeq
  ) {
    return;
  }
  engine.lastSceneHash = incomingHash;

  // 1. Quality switch (High vs Low) without reload
  if (engine.lastQuality !== quality) {
    engine.lastQuality = quality;
    engine.renderer.shadowMap.enabled = !lowQ;
    engine.sunLight.castShadow = !lowQ;
    if (engine.sky) engine.sky.visible = !lowQ;
    if (engine.seaWater) engine.seaWater.visible = !lowQ;
    if (engine.simpleSea) engine.simpleSea.visible = true;
    rebuildCityInstances(state, lowQ);
  } else {
    const isEve = (state.current_hour >= 18 || state.current_hour < 6);
    if (engine.lastHourEvening !== isEve && engine.buildingMat) {
      engine.lastHourEvening = isEve;
      engine.buildingMat.map = isEve ? engine.eveWinTex : engine.dayWinTex;
      engine.buildingMat.emissive.set(isEve ? '#F59E0B' : '#000000');
      engine.buildingMat.emissiveMap = isEve ? engine.eveWinTex : null;
      engine.buildingMat.emissiveIntensity = isEve ? 0.55 : 0.0;
      engine.buildingMat.needsUpdate = true;
    }
  }

  // Update Sky sun elevation based on simulation clock hour
  if (engine.sky) {
    const hr = Number(state.current_hour ?? 14);
    const isEve = (hr >= 18 || hr < 6);
    const elev = isEve ? 9.5 : (hr >= 11 && hr <= 15 ? 46.0 : 26.0);
    const phi = THREE.MathUtils.degToRad(90 - elev);
    const theta = THREE.MathUtils.degToRad(135);
    const sunVec = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
    engine.sky.material.uniforms['sunPosition'].value.copy(sunVec);
    engine.sunLight.intensity = isEve ? 1.05 : 1.5;
    engine.hemiLight.intensity = isEve ? 0.78 : 0.95;
  }

  // 2. Telemetry Loss Grey-out Overlay
  const tf = state.telemetry_status || {};
  const rootEl = document.getElementById('ag-root');
  const tfOverlay = document.getElementById('ag-telemetry-overlay');
  if (tf.is_telemetry_loss) {
    rootEl.classList.add('telemetry-loss');
    tfOverlay.style.display = 'block';
  } else {
    rootEl.classList.remove('telemetry-loss');
    tfOverlay.style.display = 'none';
  }

  // 3. HUD Focus Pill
  const camSpec = state.camera_target || {};
  document.getElementById('ag-focus-label').textContent = camSpec.label || 'All 6 Sectors';

  // 4. Highlighting & Sector States (chlorine NON_COMPLIANT pulse, fire emergency marker)
  const hl = state.highlight || { type: 'all', id: null, downstream_pipe_ids: [] };
  const isFocused = hl.type && hl.type !== 'all';
  const dlSet = new Set(hl.downstream_pipe_ids || []);

  (state.sectors || []).forEach(sec => {
    const rec = engine.sectorMap[sec.name];
    if (!rec) return;
    rec.nonCompliant = sec.compliance_status === 'NON_COMPLIANT';
    rec.hasFire = !!sec.has_fire_emergency;
    rec.fireGroup.visible = rec.hasFire;
    rec.fireLbl.visible = rec.hasFire;
    if (!rec.hasFire) rec.fireLbl.el.style.display = 'none';

    const secHl = !!sec.highlighted;
    const secDim = isFocused && hl.type === 'sector' && !secHl;
    rec.zoneMat.opacity = secHl ? 0.28 : (secDim ? 0.05 : 0.15);
    rec.borderMat.opacity = secDim ? 0.28 : 0.95;
    rec.lblRec.el.style.opacity = secDim ? '0.45' : '1.0';
    if (!rec.nonCompliant) rec.zoneMat.color.copy(rec.baseColor);
    rec.zoneMesh.userData.tooltip = `<strong>${sec.name}</strong> (${sec.color_name})<br/>Chlorine: ${sec.chlorine_mg_l} mg/L (<strong>${sec.compliance_status}</strong>)<br/>Total Flow: ${sec.total_flow_lps} L/s · Active Leaks: ${sec.active_leaks}${rec.hasFire ? '<br/><span style="color:#F97316;">🔥 FIRE EMERGENCY ACTIVE</span>' : ''}`;
  });

  // 5. Valves diff animations (wheel turns + green <-> red over ~2s; Reject highlight flash)
  const colOpen = new THREE.Color('#22C55E');
  const colClosed = new THREE.Color('#EF4444');
  (state.valves || []).forEach(v => {
    const rec = engine.valveMap[v.valve_id];
    if (!rec) return;
    const nextStat = String(v.status).toUpperCase();
    const isOpen = nextStat === 'OPEN';
    const colHex = isOpen ? '#22C55E' : '#EF4444';

    if (rec.status !== nextStat) {
      rec.anim = {
        start: now,
        duration: 2.0,
        fromColor: rec.status === 'OPEN' ? colOpen.clone() : colClosed.clone(),
        toColor: isOpen ? colOpen.clone() : colClosed.clone(),
        spinSign: isOpen ? -1.0 : 1.0
      };
      rec.status = nextStat;
    } else if (!rec.anim) {
      rec.wheelMat.color.copy(isOpen ? colOpen : colClosed);
      rec.wheelMat.emissive.copy(isOpen ? colOpen : colClosed);
    }

    if (viewCmd.event_type === 'valve_reject' && viewCmd.focus_id && viewCmd.focus_id.toUpperCase() === v.valve_id.toUpperCase()) {
      rec.rejectFlashUntil = now + 2.8;
    }

    rec.lblRec.el.style.borderColor = colHex;
    rec.lblRec.alwaysShow = (!isOpen) || !!v.highlighted;
    rec.wheelMat.emissiveIntensity = v.highlighted ? 0.7 : 0.35;
    rec.hit.userData.tooltip = `<strong>Valve ${v.valve_id}</strong> (${v.sector})<br/>Status: <span style="color:${colHex}; font-weight:700;">${nextStat}</span>${v.pipe_segment_id ? '<br/>Pipe: ' + v.pipe_segment_id : ''}`;
  });

  // 6. Connected pipes flow diffs, sector-only highlight/fade & full pipe tooltip
  const updatePipes = (state.connected_network && state.connected_network.pipes && state.connected_network.pipes.length)
    ? state.connected_network.pipes
    : (state.pipes || []);
  const segPressMap = {};
  (state.pipes || []).forEach(sp => { segPressMap[sp.segment_id] = sp.pressure_psi; });

  updatePipes.forEach(p => {
    const keyId = p.pipe_id || p.segment_id;
    const tr = engine.pipeMap[keyId];
    if (!tr) return;
    const nextFlow = Number(p.flow_lps || 0);
    if (Math.abs(nextFlow - tr.targetFlow) > 0.3) {
      tr.prevFlow = tr.currentFlow;
      tr.targetFlow = nextFlow;
      tr.animStart = now;
      tr.delay = (tr.pipe_class === 'TRUNK_MAIN') ? 0.15 : 0.65;
    }
    // Selecting a sector highlights ONLY that sector's pipes and fades all others!
    // Affected pipes for a pending valve proposal or supply-continuity refusal glow BRIGHT RED before approval!
    const inImpactSet = dlSet.has(p.segment_id) || dlSet.has(keyId);
    const isRedImpactPreview = inImpactSet && (
      viewCmd.event_type === 'staged_proposal' ||
      viewCmd.event_type === 'supply_continuity_refused' ||
      (hl.type === 'valve' && viewCmd.event_type !== 'valve_close')
    );
    let pHl = !!p.highlighted || inImpactSet;
    let pDim = false;
    if (hl.type === 'sector' && hl.id) {
      const sameSec = String(p.sector || '').toLowerCase() === String(hl.id).toLowerCase();
      pHl = sameSec || inImpactSet;
      pDim = !sameSec && !inImpactSet;
    } else if (hl.type === 'valve' && hl.id) {
      pDim = !pHl;
    }

    tr.isImpactAlert = isRedImpactPreview;
    tr.isDimmed = pDim;
    tr.baseOpacity = pDim ? 0.18 : 0.96;
    tr.baseEmissive = isRedImpactPreview
      ? new THREE.Color('#EF4444')
      : (pHl ? tr.activeColor.clone() : new THREE.Color('#000000'));
    tr.baseEmissiveIntensity = isRedImpactPreview ? 0.85 : (pHl ? 0.50 : 0.0);

    if (engine.hoveredRunId !== tr.run_id) {
      tr.mat.opacity = tr.baseOpacity;
      tr.mat.emissive.copy(tr.baseEmissive);
      tr.mat.emissiveIntensity = tr.baseEmissiveIntensity;
    }

    const stLabel = p.status || (nextFlow <= 0.05 ? 'NO_FLOW' : (p.rerouted ? 'REROUTED' : 'FLOWING'));
    const stColor = stLabel === 'NO_FLOW' ? '#EF4444' : (stLabel === 'REROUTED' ? '#F59E0B' : '#22C55E');
    const pressVal = p.pressure_psi !== undefined ? p.pressure_psi : segPressMap[p.segment_id];
    const pressStr = pressVal !== undefined ? ` · ${pressVal} psi` : '';
    const valveStr = p.isolation_valve_id ? ` · Valve ${p.isolation_valve_id}` : '';
    tr.tube.userData.tooltip =
      `<strong>${keyId}</strong> (${p.sector || tr.sector})<br/>` +
      `Class: <strong>${tr.class_label}</strong> · <strong>${tr.diameter_mm} mm</strong><br/>` +
      `Route: <code>${tr.from_node} &rarr; ${tr.to_node}</code><br/>` +
      `Flow: <strong>${p.flow_lps} L/s</strong> · Status: <strong style="color:${stColor};">${stLabel}</strong>${valveStr}${pressStr}`;
  });

  // 7. Sensors
  (state.sensors || []).forEach(s => {
    const rec = engine.sensorMap[s.sensor_id];
    if (!rec) return;
    const isQ = !!s.quarantined;
    rec.mat.color.set(isQ ? '#94A3B8' : '#38BDF8');
    rec.mat.emissive.set(isQ ? '#475569' : '#0EA5E9');
    rec.mat.emissiveIntensity = isQ ? 0.25 : 0.95;
    rec.warnLbl.visible = isQ;
    if (!isQ) rec.warnLbl.el.style.display = 'none';
    rec.mesh.userData.tooltip = `<strong>Sensor ${s.sensor_id}</strong> (${s.junction_id}, ${s.sector})<br/>Reading: ${s.value} ${s.unit}<br/>Status: <strong>${s.status}</strong>${isQ && s.reasons && s.reasons.length ? '<br/>Reason: ' + s.reasons[0] : ''}`;
  });

  // 8. Leaks (spray + puddle; stops when isolated!)
  syncLeaks(state, lowQ);

  // 9. DESAL-01 Plant output & Intake 2 algae / ISOLATED status
  const pl = state.plant || {};
  if (engine.plantRig) {
    const pr = engine.plantRig;
    const nextOut = Number(pl.output_mld || 100);
    if (Math.abs(nextOut - pr.targetOut) > 0.2) {
      pr.prevOut = pr.currentOut;
      pr.targetOut = nextOut;
      pr.animStart = now;
    }
    pr.mainLbl.el.textContent = pl.label || `DESAL-01 — ${nextOut.toFixed(0)} MLD`;

    const intakes = pl.intakes || [];
    const int2 = intakes[1] || { status: 'ACTIVE', algae_tint: false, turbidity_ntu: 1.25 };
    const algaeActive = !!int2.algae_tint;
    const int2Iso = String(int2.status).toUpperCase() === 'ISOLATED';
    pr.algaePlume.visible = algaeActive;
    pr.intake2Mat.color.set(algaeActive ? '#22C55E' : '#0284C7');
    pr.intake2Mat.emissive.set(algaeActive ? '#15803D' : '#000000');
    pr.intake2Mat.emissiveIntensity = algaeActive ? 0.45 : 0.0;
    pr.int2Lbl.el.textContent = int2Iso ? 'Intake 2 — ISOLATED' : (algaeActive ? 'Intake 2 (Algae)' : 'Intake 2');
    pr.int2Lbl.el.style.borderColor = int2Iso ? '#EF4444' : (algaeActive ? '#22C55E' : '#38BDF8');
    pr.intake2.userData.tooltip = `<strong>Intake 2 (DESAL-01)</strong><br/>Status: <strong>${int2.status}</strong> · Turbidity: ${int2.turbidity_ntu} NTU${algaeActive ? '<br/><span style="color:#4ADE80;">Algal bloom tint active</span>' : ''}`;
  }

  // 10. RES-01 Reservoir smooth level & floor markers
  const res = state.reservoir || {};
  if (engine.resRig) {
    const rr = engine.resRig;
    const nextPct = Number(res.level_percent || 48);
    if (Math.abs(nextPct - rr.targetPct) > 0.05) {
      rr.prevPct = rr.currentPct;
      rr.targetPct = nextPct;
      rr.animStart = now;
    }
    rr.baseFloorPct = Number(res.base_floor_percent || 35);
    rr.dynFloorPct = Number(res.safety_floor_percent || 35);
    rr.warnFloorPct = Number(res.warning_floor_percent || (rr.dynFloorPct + 5));
    rr.rateStr = res.rate_str || '';
    rr.floorEtaStr = res.floor_eta_str || '';
    rr.hasEmergency = !!res.has_active_emergency;

    // Position floor marker rings on the inner wall
    rr.baseFloorRing.position.y = 0.4 + rr.H * (rr.baseFloorPct / 100.0);
    rr.warningFloorRing.position.y = 0.4 + rr.H * (rr.warnFloorPct / 100.0);
    const showDyn = rr.hasEmergency || (rr.dynFloorPct > rr.baseFloorPct + 0.05);
    rr.dynamicFloorRing.visible = showDyn;
    rr.dynamicFloorRing.position.y = 0.4 + rr.H * (rr.dynFloorPct / 100.0);
    rr.dynLbl.visible = showDyn;
    if (showDyn) {
      rr.dynLbl.el.textContent = `Dynamic Floor ${rr.dynFloorPct.toFixed(1)}%`;
      rr.dynLbl.pos.set(rr.rx - rr.R - 0.8, 0.4 + rr.H * (rr.dynFloorPct / 100.0) + 0.4, rr.rz);
    } else {
      rr.dynLbl.el.style.display = 'none';
    }
    rr.glassMat.opacity = res.look_inside ? 0.14 : 0.24;
    const rateLine = rr.rateStr ? `<br/>Trend: <strong>${rr.rateStr}</strong> (${rr.floorEtaStr})` : '';
    rr.glassWall.userData.tooltip = `<strong>RES-01 Strategic Reservoir</strong><br/>Level: <strong>${nextPct.toFixed(1)}%</strong> (${res.volume_ml} / ${res.capacity_ml} ML)${rateLine}<br/>Safety Floor: ${rr.baseFloorPct}%${showDyn ? ' · Dynamic Floor: <strong>' + rr.dynFloorPct.toFixed(1) + '%</strong>' : ''} · Warning: ${rr.warnFloorPct.toFixed(1)}%`;
  }

  // 11. Camera fly-to ONLY when view_command.seq increments AND (followChat ON or explicit user button!)
  const cmdSeq = Number(viewCmd.seq || 0);
  const isManualBtn = (viewCmd.event_type === 'reset' || viewCmd.event_type === 'button_focus');
  if (cmdSeq !== engine.lastCommandSeq) {
    engine.lastCommandSeq = cmdSeq;
    if (viewCmd.note) showEventToast(viewCmd.note);
    if ((followChat || isManualBtn) && camSpec.position_xyz && camSpec.target_xz) {
      engine.flyAnim = {
        startPos: engine.camera.position.clone(),
        endPos: new THREE.Vector3(camSpec.position_xyz[0] * S, camSpec.position_xyz[1] * S, camSpec.position_xyz[2] * S),
        startTarget: engine.controls.target.clone(),
        endTarget: new THREE.Vector3(camSpec.target_xz[0] * S, (camSpec.target_y || 0) * S, camSpec.target_xz[1] * S),
        startTime: now,
        duration: 1.15
      };
    }
  }
}

function startAnimationLoop() {
  const projVec = new THREE.Vector3();
  const pDummy = new THREE.Object3D();
  const pPos = new THREE.Vector3();
  const pTan = new THREE.Vector3();
  const coneUp = new THREE.Vector3(0, 1, 0);
  const colBlue = new THREE.Color('#0EA5E9');
  const colOrange = new THREE.Color('#F97316');
  const colRed = new THREE.Color('#EF4444');
  const colNonComp = new THREE.Color('#F97316');

  function animate() {
    requestAnimationFrame(animate);
    const t = engine.clock.getElapsedTime();
    const dt = Math.min(0.05, Math.max(0.001, t - engine.prevTime));
    engine.prevTime = t;

    // 1. Camera fly-to
    if (engine.flyAnim) {
      const u = easeOutCubic((t - engine.flyAnim.startTime) / engine.flyAnim.duration);
      engine.camera.position.lerpVectors(engine.flyAnim.startPos, engine.flyAnim.endPos, u);
      engine.controls.target.lerpVectors(engine.flyAnim.startTarget, engine.flyAnim.endTarget, u);
      if (u >= 1.0) engine.flyAnim = null;
    }
    engine.controls.update();

    // 2. Animated coastal sea ripples
    if (engine.seaWater && engine.seaWater.visible) {
      engine.seaWater.material.uniforms['time'].value += dt * 0.55;
    }

    // 3. Sector NON_COMPLIANT orange pulse & Fire Emergency flicker
    for (const rec of Object.values(engine.sectorMap)) {
      if (rec.nonCompliant) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 4.2);
        rec.zoneMat.color.copy(rec.baseColor).lerp(colNonComp, 0.55 + 0.4 * pulse);
        rec.zoneMat.opacity = 0.20 + 0.16 * pulse;
      }
      if (rec.hasFire) {
        rec.fireGroup.scale.set(1.0 + 0.14 * Math.sin(t * 7), 1.0 + 0.22 * Math.sin(t * 9.5), 1.0 + 0.14 * Math.cos(t * 7));
      }
    }

    // 4. Plant DESAL-01 smooth output gauge & pump rotation speed proportional to MLD
    if (engine.plantRig) {
      const pr = engine.plantRig;
      const pu = easeOutCubic((t - pr.animStart) / 1.8);
      pr.currentOut = pr.prevOut + (pr.targetOut - pr.prevOut) * pu;
      const ratio = Math.max(0.05, Math.min(1.0, pr.currentOut / Math.max(1, pr.maxCap)));
      pr.gaugeBar.scale.x = ratio;
      pr.gaugeBar.position.x = 1.0 - 2.5 + 2.5 * ratio;
      pr.gaugeMat.emissiveIntensity = 0.55 + 0.4 * Math.sin(t * (2.0 + ratio * 6.0));
      const pumpSpin = dt * (0.8 + ratio * 7.5);
      for (const rotor of pr.pumpRotors) rotor.rotation.z += pumpSpin;
    }

    // 5. Reservoir RES-01 smooth water level, rippling surface & floor-proximity color
    if (engine.resRig) {
      const rr = engine.resRig;
      const ru = easeOutCubic((t - rr.animStart) / 2.0);
      rr.currentPct = rr.prevPct + (rr.targetPct - rr.prevPct) * ru;
      const waterH = rr.H * Math.max(0.03, Math.min(0.98, rr.currentPct / 100.0));
      rr.waterBody.scale.y = waterH;
      rr.waterBody.position.y = 0.4 + waterH * 0.5;
      const ripple = 0.05 * Math.sin(t * 3.2);
      rr.waterSurface.position.y = 0.4 + waterH + ripple;
      rr.currentRing.position.y = 0.4 + waterH;
      const rPart = rr.rateStr ? ` ${rr.rateStr}` : '';
      const ePart = rr.floorEtaStr ? ` · ${rr.floorEtaStr}` : '';
      rr.resLbl.el.textContent = `RES-01 · ${rr.currentPct.toFixed(1)}%${rPart}${ePart}`;

      // Color: blue normal, orange near floor (<= floor + 5%), red at/below floor
      if (rr.currentPct <= rr.dynFloorPct + 0.05) {
        rr.waterMat.color.copy(colRed);
        rr.waterMat.emissive.copy(colRed);
        rr.waterMat.emissiveIntensity = 0.55 + 0.25 * Math.sin(t * 5.0);
      } else if (rr.currentPct <= rr.warnFloorPct) {
        rr.waterMat.color.copy(colOrange);
        rr.waterMat.emissive.copy(colOrange);
        rr.waterMat.emissiveIntensity = 0.45 + 0.2 * Math.sin(t * 3.5);
      } else {
        rr.waterMat.color.copy(colBlue);
        rr.waterMat.emissive.set('#0369A1');
        rr.waterMat.emissiveIntensity = 0.35;
      }
    }

    // 6. Valve wheel rotation & color transitions (~2s) + Reject flash
    for (const v of Object.values(engine.valveMap)) {
      if (v.anim) {
        const vu = easeOutCubic((t - v.anim.start) / v.anim.duration);
        v.wheelGroup.rotation.y = v.anim.spinSign * Math.PI * 2.0 * vu;
        v.wheelMat.color.copy(v.anim.fromColor).lerp(v.anim.toColor, vu);
        v.wheelMat.emissive.copy(v.anim.fromColor).lerp(v.anim.toColor, vu);
        if (vu >= 1.0) v.anim = null;
      }
      if (t < v.rejectFlashUntil) {
        v.wheelGroup.scale.setScalar(1.0 + 0.28 * Math.sin(t * 14.0));
      } else {
        v.wheelGroup.scale.setScalar(1.0);
      }
    }

    // 7. Small light-cyan water particles (~1/4 pipe diameter) + directional flow arrows (from_node -> to_node)
    if (engine.flowInst || engine.arrowInst) {
      let pIdx = 0;
      let aIdx = 0;
      for (const tr of engine.flowTracks) {
        const fu = tr.delay > 0 ? easeOutCubic((t - tr.animStart - tr.delay) / 1.8) : easeOutCubic((t - tr.animStart) / 1.4);
        tr.currentFlow = tr.prevFlow + (tr.targetFlow - tr.prevFlow) * fu;
        if (tr.mat) {
          if (tr.isImpactAlert) {
            const alertPulse = 0.55 + 0.40 * Math.sin(t * 4.5);
            tr.mat.color.copy(colRed);
            if (engine.hoveredRunId !== tr.run_id) {
              tr.mat.emissive.copy(colRed);
              tr.mat.emissiveIntensity = alertPulse;
            }
          } else {
            tr.mat.color.copy(tr.dryColor).lerp(tr.activeColor, Math.min(1.0, tr.currentFlow / 25.0));
          }
        }
        const speed = (tr.currentFlow / 100.0) * 0.24;
        const dimFactor = tr.isDimmed ? 0.35 : 1.0;
        const activeCount = tr.currentFlow <= 0.05 ? 0 : Math.max(1, Math.min(tr.particles.length, Math.round((tr.currentFlow / 110.0) * tr.particles.length)));
        // Particle radius strictly ~1/4 of pipe diameter (i.e. ~0.5 * pipe radius * 0.55 = 0.26 * pipe radius)
        const pRadius = tr.currentFlow <= 0.05 ? 0.0 : Math.max(0.06, tr.radius * 0.28) * dimFactor;

        if (engine.flowInst) {
          for (let k = 0; k < tr.particles.length; k++) {
            const pt = tr.particles[k];
            if (k < activeCount && pRadius > 0.0) {
              pt.phase = (pt.phase + dt * speed) % 1.0;
              tr.curve.getPointAt(pt.phase, pPos);
              pDummy.position.set(pPos.x, pPos.y + tr.radius * 0.45, pPos.z);
              pDummy.rotation.set(0, 0, 0);
              pDummy.scale.setScalar(pRadius);
            } else {
              pDummy.position.set(0, -200, 0);
              pDummy.scale.setScalar(0.0);
            }
            pDummy.updateMatrix();
            engine.flowInst.setMatrixAt(pIdx++, pDummy.matrix);
          }
        }

        // Flow direction arrows oriented strictly along curve tangent (from_node -> to_node)
        if (engine.arrowInst) {
          const arrowScale = tr.currentFlow <= 0.05 ? 0.0 : Math.max(0.14, tr.radius * 0.56) * dimFactor;
          for (let k = 0; k < tr.arrows.length; k++) {
            const ar = tr.arrows[k];
            if (arrowScale > 0.0) {
              ar.phase = (ar.phase + dt * speed * 0.55) % 1.0;
              tr.curve.getPointAt(ar.phase, pPos);
              tr.curve.getTangentAt(ar.phase, pTan).normalize();
              pDummy.position.set(pPos.x, pPos.y + tr.radius + arrowScale * 0.55, pPos.z);
              pDummy.quaternion.setFromUnitVectors(coneUp, pTan);
              pDummy.scale.setScalar(arrowScale);
            } else {
              pDummy.position.set(0, -200, 0);
              pDummy.scale.setScalar(0.0);
            }
            pDummy.updateMatrix();
            engine.arrowInst.setMatrixAt(aIdx++, pDummy.matrix);
          }
        }
      }
      if (engine.flowInst) engine.flowInst.instanceMatrix.needsUpdate = true;
      if (engine.arrowInst) engine.arrowInst.instanceMatrix.needsUpdate = true;
    }

    // 8. Leak spray fountains & puddles (status-driven; stops smoothly when isolated!)
    for (const lk of Object.values(engine.leakMap)) {
      if (!lk.group.visible) continue;
      const sMul = lk.sprayScale !== undefined ? lk.sprayScale : 1.0;
      const sprayInt = lk.isActive ? sMul : (lk.isolatedAt !== null ? Math.max(0.0, sMul * (1.0 - easeOutCubic((t - lk.isolatedAt - 0.6) / 1.8))) : 0.0);
      if (lk.isPulsing) {
        lk.core.scale.setScalar(1.0 + 0.28 * Math.sin(t * 4.5));
        const rScale = 1.0 + ((t * 1.4) % 1.8);
        lk.ring.scale.setScalar(rScale);
        lk.ringMat.opacity = Math.max(0.0, 0.8 - (rScale - 1.0) * 0.45);
        lk.puddle.scale.setScalar(0.95 + 0.12 * Math.sin(t * 2.2));
      } else {
        lk.core.scale.setScalar(0.82);
        lk.ringMat.opacity = lk.ring.visible ? 0.35 : 0.0;
        lk.puddleMat.opacity = 0.14 + 0.28 * sprayInt;
      }
      for (const dr of lk.sprayDrops) {
        if (sprayInt <= 0.02) {
          dr.mesh.visible = false;
        } else {
          dr.mesh.visible = true;
          const cyc = (t * 1.65 + dr.offset) % 1.0;
          const r = cyc * dr.speed * 1.65 * sprayInt;
          const y = 1.3 + (4.2 * cyc - 4.2 * cyc * cyc) * (2.7 * sprayInt);
          dr.mesh.position.set(lk.lx + Math.cos(dr.ang) * r, Math.max(0.2, y), lk.lz + Math.sin(dr.ang) * r);
          dr.mesh.scale.setScalar(0.85 * sprayInt);
        }
      }
    }

    // 9. Project floating 3D labels (distance-aware so overview stays crisp & uncluttered)
    const wrap = document.getElementById('ag-canvas-wrap');
    const cw = wrap.clientWidth || 800;
    const ch = wrap.clientHeight || 450;
    for (const item of engine.labelAnchors) {
      if (!item.visible) { item.el.style.display = 'none'; continue; }
      if (!item.alwaysShow && item.maxDist < Infinity && engine.camera.position.distanceTo(item.pos) > item.maxDist) {
        item.el.style.display = 'none';
        continue;
      }
      projVec.copy(item.pos).project(engine.camera);
      if (projVec.z > 1.0) {
        item.el.style.display = 'none';
      } else {
        const sx = (projVec.x * 0.5 + 0.5) * cw;
        const sy = (-projVec.y * 0.5 + 0.5) * ch;
        if (sx < -40 || sx > cw + 40 || sy < -30 || sy > ch + 30) {
          item.el.style.display = 'none';
        } else {
          item.el.style.display = 'block';
          item.el.style.left = sx + 'px';
          item.el.style.top = sy + 'px';
        }
      }
    }

    engine.renderer.render(engine.scene, engine.camera);
  }
  animate();
}

window.__AQUAGRID_APPLY_UPDATE__ = (args) => {
  try {
    applySceneUpdate(args);
  } catch (err) {
    console.error('AquaGrid 3D Twin update error:', err);
    render2DFallback('WebGL failed to render — showing the 2D OpenStreetMap fallback view.', args && args.scene_state);
  }
};
window.__AQUAGRID_ENGINE_READY__ = true;
if (window.__AQUAGRID_PENDING_ARGS__) {
  const pending = window.__AQUAGRID_PENDING_ARGS__;
  window.__AQUAGRID_PENDING_ARGS__ = null;
  window.__AQUAGRID_APPLY_UPDATE__(pending);
}
</script>
</body>
</html>
