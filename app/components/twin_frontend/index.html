<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AquaGrid Realistic 3D Digital Twin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0B1220;
    color: #F8FAFC;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #ag-root {
    position: relative;
    width: 100%;
    height: 450px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #1E293B;
    background: #0B1220;
    transition: filter 0.35s ease;
  }
  #ag-root.telemetry-loss #ag-canvas-wrap {
    filter: grayscale(0.92) brightness(0.68);
  }
  #ag-canvas-wrap {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #ag-labels {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 12;
  }
  .ag-label {
    position: absolute;
    transform: translate(-50%, -100%);
    white-space: nowrap;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.84);
    border: 1px solid rgba(148, 163, 184, 0.4);
    color: #F8FAFC;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    user-select: none;
  }
  .ag-label-valve {
    font-size: 9px;
    padding: 1px 4px;
    background: rgba(15, 23, 42, 0.78);
  }
  .ag-label-junc {
    font-size: 8.5px;
    font-weight: 600;
    padding: 1px 4px;
    background: rgba(15, 23, 42, 0.74);
    border-color: rgba(148, 163, 184, 0.55);
    color: #CBD5E1;
  }
  .ag-label-part {
    font-size: 9.5px;
    padding: 1px 5px;
    background: rgba(15, 23, 42, 0.82);
    border-color: #38BDF8;
    color: #E0F2FE;
  }
  .ag-label-warn {
    font-size: 10px;
    padding: 1px 5px;
    background: rgba(245, 158, 11, 0.94);
    color: #0F172A;
    border-color: #FEF3C7;
  }
  .ag-label-danger {
    font-size: 10px;
    padding: 2px 6px;
    background: rgba(220, 38, 38, 0.94);
    color: #FFFFFF;
    border-color: #FECACA;
  }
  #ag-hud-top {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 20;
    gap: 8px;
  }
  .ag-pill {
    pointer-events: auto;
    background: rgba(15, 23, 42, 0.86);
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11px;
    color: #E2E8F0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
  }
  #ag-event-toast {
    display: none;
    position: absolute;
    top: 46px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 28;
    background: rgba(15, 23, 42, 0.94);
    border: 1px solid #F59E0B;
    color: #FEF3C7;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    pointer-events: none;
  }
  #ag-telemetry-overlay {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 29;
    background: rgba(127, 29, 29, 0.92);
    border: 2px solid #EF4444;
    color: #FEF2F2;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.03em;
    box-shadow: 0 6px 24px rgba(0,0,0,0.55);
    pointer-events: none;
    text-align: center;
  }
  #ag-tooltip {
    position: absolute;
    display: none;
    pointer-events: none;
    z-index: 32;
    max-width: 270px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid #38BDF8;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 11px;
    line-height: 1.4;
    color: #F8FAFC;
    box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  }
  #ag-legend {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 20;
    background: rgba(15, 23, 42, 0.90);
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 10px;
    max-width: 235px;
    max-height: 320px;
    overflow-y: auto;
    color: #E2E8F0;
  }
  #ag-legend summary {
    cursor: pointer;
    font-weight: 700;
    user-select: none;
  }
  .ag-leg-row {
    display: flex;
    align-items: center;
    gap: 5px;
    margin: 2px 0;
  }
  .ag-swatch {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  #ag-fallback {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    background: #0F172A;
    z-index: 40;
  }
  #ag-fallback-banner {
    padding: 8px 12px;
    background: #1E293B;
    border-bottom: 1px solid #334155;
    font-size: 12px;
    color: #FDE68A;
  }
  #ag-fallback-map {
    flex: 1;
    width: 100%;
    height: 100%;
  }
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="ag-root">
  <div id="ag-canvas-wrap"></div>
  <div id="ag-labels"></div>
  <div id="ag-hud-top">
    <div class="ag-pill" id="ag-status-pill">
      <strong>AquaGrid 3D Twin</strong> · <span id="ag-focus-label">Initializing...</span>
    </div>
    <div class="ag-pill" id="ag-meta-pill" style="font-size:10px; color:#94A3B8;">
      Drag: rotate · Scroll: zoom · Right-drag: pan
    </div>
  </div>
  <div id="ag-event-toast"></div>
  <div id="ag-telemetry-overlay">TELEMETRY LOSS — holding last safe state</div>
  <div id="ag-tooltip"></div>
  <details id="ag-legend">
    <summary>3D Legend</summary>
    <div style="margin-top:4px; padding-top:4px; border-top:1px solid #334155;" id="ag-legend-body"></div>
  </details>
  <div id="ag-fallback">
    <div id="ag-fallback-banner">
      WebGL is unavailable in this browser — showing the 2D OpenStreetMap fallback view.
    </div>
    <div id="ag-fallback-map"></div>
  </div>
</div>

<script>
// ── Bidirectional Streamlit Component v1 Wire Protocol (zero reload across reruns) ──
window.__AQUAGRID_LAST_ARGS__ = null;
window.__AQUAGRID_RENDER_COUNT__ = 0;
window.__AQUAGRID_ENGINE_READY__ = false;
window.__AQUAGRID_PENDING_ARGS__ = null;

function sendToStreamlit(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data || {}), "*");
}

function detectWebGL(forceNoWebgl) {
  if (forceNoWebgl) return false;
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (e) {
    return false;
  }
}

let fallbackMounted = false;
let fallbackLeafletMap = null;
function render2DFallback(reasonMsg, sceneState) {
  const fb = document.getElementById('ag-fallback');
  const banner = document.getElementById('ag-fallback-banner');
  if (reasonMsg) banner.textContent = reasonMsg;
  fb.style.display = 'flex';
  if (fallbackMounted) return;
  fallbackMounted = true;

  const state = sceneState || (window.__AQUAGRID_LAST_ARGS__ && window.__AQUAGRID_LAST_ARGS__.scene_state) || {};
  const center = state.center_latlon || [25.1972, 55.2744];

  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);

  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
  script.onload = () => {
    try {
      fallbackLeafletMap = L.map('ag-fallback-map').setView(center, 11);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(fallbackLeafletMap);
      const refLat = center[0], refLon = center[1];
      const cosLat = Math.cos(refLat * Math.PI / 180);
      const xzToLatLon = (x, z) => [refLat - z / 111320.0, refLon + x / (111320.0 * cosLat)];
      const bounds = [];
      (state.sectors || []).forEach(sec => {
        const latlngs = (sec.polygon_xz || []).map(p => xzToLatLon(p[0], p[1]));
        if (latlngs.length >= 3) {
          L.polygon(latlngs, { color: sec.color, weight: 2.5, fillOpacity: 0.14 }).bindTooltip(sec.name).addTo(fallbackLeafletMap);
          latlngs.forEach(ll => bounds.push(ll));
        }
      });
      (state.pipes || []).forEach(pipe => {
        const latlngs = (pipe.points_xz || []).map(p => xzToLatLon(p[0], p[1]));
        if (latlngs.length >= 2) {
          L.polyline(latlngs, { color: pipe.color, weight: pipe.is_trunk ? 4 : 2.5 }).bindTooltip(pipe.segment_id + ' (' + pipe.flow_lps + ' L/s)').addTo(fallbackLeafletMap);
        }
      });
      if (bounds.length > 0) fallbackLeafletMap.fitBounds(bounds, { padding: [18, 18] });
    } catch (err) {
      banner.textContent = 'WebGL is unavailable; toggle "2D map" in the sidebar to inspect the network.';
    }
  };
  document.head.appendChild(script);
}
window.render2DFallback = render2DFallback;

window.addEventListener("message", (event) => {
  if (!event.data || event.data.type !== "streamlit:render") return;
  const args = event.data.args || {};
  window.__AQUAGRID_LAST_ARGS__ = args;
  window.__AQUAGRID_RENDER_COUNT__ += 1;

  const h = Number(args.height || 450);
  document.getElementById('ag-root').style.height = h + 'px';
  sendToStreamlit("streamlit:setFrameHeight", { height: h + 2 });

  if (!detectWebGL(!!args.force_no_webgl)) {
    render2DFallback('WebGL is unavailable in this browser — showing the 2D OpenStreetMap fallback view.', args.scene_state);
    return;
  }
  if (window.__AQUAGRID_APPLY_UPDATE__) {
    window.__AQUAGRID_APPLY_UPDATE__(args);
  } else {
    window.__AQUAGRID_PENDING_ARGS__ = args;
  }
});

// Signal readiness to Streamlit host
sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
sendToStreamlit("streamlit:setFrameHeight", { height: 452 });
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { Water } from 'three/addons/objects/Water.js';

// ── Procedural Canvas Textures (zero external texture URLs needed) ──
function createWaterNormalsTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = (x / size) * Math.PI * 2;
      const v = (y / size) * Math.PI * 2;
      const dx = Math.cos(u * 4 + Math.sin(v * 3)) * 0.45 + Math.cos(u * 9 - v * 5) * 0.2;
      const dy = Math.sin(v * 5 + Math.cos(u * 4)) * 0.45 + Math.sin(v * 8 + u * 6) * 0.2;
      const idx = (y * size + x) * 4;
      img.data[idx]     = Math.floor((dx * 0.5 + 0.5) * 255);
      img.data[idx + 1] = Math.floor((dy * 0.5 + 0.5) * 255);
      img.data[idx + 2] = 255;
      img.data[idx + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

function createBuildingWindowTexture(isEvening) {
  const w = 128, h = 256;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = isEvening ? '#1E293B' : '#94A3B8';
  ctx.fillRect(0, 0, w, h);
  let seed = isEvening ? 1337 : 4242;
  const nextRand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  for (let row = 6; row < h - 8; row += 14) {
    for (let col = 6; col < w - 8; col += 12) {
      const r = nextRand();
      if (isEvening) {
        ctx.fillStyle = r < 0.58 ? '#FDE68A' : (r < 0.72 ? '#BAE6FD' : '#0F172A');
      } else {
        ctx.fillStyle = r < 0.65 ? '#CBD5E1' : '#334155';
      }
      ctx.fillRect(col, row, 7, 9);
    }
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// ── Persistent Scene Engine (mounted ONCE, updated in place forever!) ──
const engine = {
  initialized: false,
  renderer: null,
  scene: null,
  camera: null,
  controls: null,
  sunLight: null,
  hemiLight: null,
  sky: null,
  seaWater: null,
  simpleSea: null,
  waterNormals: null,
  dayWinTex: null,
  eveWinTex: null,
  buildingInst: null,
  buildingMat: null,
  treeTrunksInst: null,
  treeCrownsInst: null,
  staticCityBuiltQuality: null,
  lastHourEvening: null,
  lastCommandSeq: -1,
  lastQuality: 'High',
  scale: 0.01,
  hoverables: [],
  labelAnchors: [],
  // Dynamic registries updated in place without reload
  sectorMap: {},     // name -> { zoneMesh, borderLine, labelEl, fireGroup, fireLblEl, baseColor, nonCompliant }
  pipeMap: {},       // pipe_id -> { tube, mat, curve, radius, run_id, activeColor, dryColor, ... }
  pipesByRun: {},    // run_id -> [pipeTrack, ...] for whole-run hover highlight
  hoveredRunId: null,
  flowInst: null,
  arrowInst: null,
  flowTracks: [],
  valveMap: {},      // valve_id -> { group, wheelGroup, wheelMat, hit, labelEl, status, anim }
  sensorMap: {},     // sensor_id -> { mesh, warnLabelEl }
  leakMap: {},       // leak_id -> { group, core, ring, puddle, puddleMat, sprayDrops, labelEl, isActive, isolatedAt }
  plantRig: null,    // detailed DESAL-01 rig
  resRig: null,      // detailed RES-01 Look-Inside rig
  supplyTrack: null,
  flyAnim: null,
  toastTimeout: null,
  clock: new THREE.Clock(),
  prevTime: 0,
  prevState: null,
};

function showEventToast(text, durationMs = 3400) {
  const el = document.getElementById('ag-event-toast');
  if (!text) return;
  el.textContent = text;
  el.style.display = 'block';
  if (engine.toastTimeout) clearTimeout(engine.toastTimeout);
  engine.toastTimeout = setTimeout(() => { el.style.display = 'none'; }, durationMs);
}

function registerLabel(text, worldPos, clsName = 'ag-label', borderColor = null, maxDist = Infinity) {
  const el = document.createElement('div');
  el.className = clsName;
  el.textContent = text;
  if (borderColor) el.style.borderColor = borderColor;
  document.getElementById('ag-labels').appendChild(el);
  const rec = { el, pos: worldPos.clone(), visible: true, maxDist: maxDist, alwaysShow: false };
  engine.labelAnchors.push(rec);
  return rec;
}

function easeOutCubic(x) {
  const c = Math.max(0, Math.min(1, x));
  return 1 - Math.pow(1 - c, 3);
}

function initEngine(state, quality) {
  const container = document.getElementById('ag-canvas-wrap');
  const lowQ = quality === 'Low';
  engine.scale = 1.0 / (state.scale_m_per_unit || 100.0);
  const S = engine.scale;

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: !lowQ, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, lowQ ? 1.2 : 1.85));
  renderer.setSize(container.clientWidth || 800, container.clientHeight || 450);
  renderer.shadowMap.enabled = !lowQ;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.65;
  container.appendChild(renderer.domElement);
  engine.renderer = renderer;

  // Scene & Fog (coastal sky-blue haze)
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#1B365D');
  scene.fog = new THREE.FogExp2('#23426B', 0.00085);
  engine.scene = scene;

  // Camera & OrbitControls
  const camera = new THREE.PerspectiveCamera(44, (container.clientWidth || 800) / (container.clientHeight || 450), 0.3, 2200);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.075;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 4.5;
  controls.maxDistance = 540;
  engine.camera = camera;
  engine.controls = controls;

  const camSpec = state.camera_target || { target_xz: [0, 1200], target_y: 0, position_xyz: [-14500, 12800, 16200] };
  camera.position.set(camSpec.position_xyz[0] * S, camSpec.position_xyz[1] * S, camSpec.position_xyz[2] * S);
  controls.target.set(camSpec.target_xz[0] * S, (camSpec.target_y || 0) * S, camSpec.target_xz[1] * S);
  controls.update();

  // Lighting: DirectionalLight with soft shadows + HemisphereLight
  const hemi = new THREE.HemisphereLight('#BAE6FD', '#334155', 0.95);
  scene.add(hemi);
  engine.hemiLight = hemi;

  const sun = new THREE.DirectionalLight('#FFF7ED', 1.5);
  sun.position.set(130, 190, 95);
  sun.castShadow = !lowQ;
  sun.shadow.mapSize.width = 1024;
  sun.shadow.mapSize.height = 1024;
  sun.shadow.camera.near = 20;
  sun.shadow.camera.far = 650;
  const d = 190;
  sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
  sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  engine.sunLight = sun;

  // Realistic Sky addon
  const sky = new Sky();
  sky.scale.setScalar(2000);
  const skyUniforms = sky.material.uniforms;
  skyUniforms['turbidity'].value = 3.2;
  skyUniforms['rayleigh'].value = 2.0;
  skyUniforms['mieCoefficient'].value = 0.004;
  skyUniforms['mieDirectionalG'].value = 0.78;
  sky.visible = !lowQ;
  scene.add(sky);
  engine.sky = sky;

  // Ground Plane (coastal desert-urban base)
  const land = new THREE.Mesh(
    new THREE.PlaneGeometry(820, 820),
    new THREE.MeshStandardMaterial({ color: '#273549', roughness: 0.90, metalness: 0.04 })
  );
  land.rotation.x = -Math.PI / 2;
  land.position.y = -0.18;
  land.receiveShadow = true;
  scene.add(land);

  const grid = new THREE.GridHelper(520, 52, '#334E68', '#1E3148');
  grid.position.y = -0.10;
  scene.add(grid);

  // Western Coastal Sea (Water addon with normalized UVs for smooth Gulf turquoise ripples)
  engine.waterNormals = createWaterNormalsTexture();
  const coastPts = (state.coastline_xz || []).map(p => [p[0] * S, p[1] * S]);
  if (coastPts.length >= 2) {
    const seaShape = new THREE.Shape();
    seaShape.moveTo(-420, -coastPts[0][1]);
    for (const [cx, cz] of coastPts) seaShape.lineTo(cx, -cz);
    seaShape.lineTo(-420, -coastPts[coastPts.length - 1][1]);
    seaShape.closePath();

    const seaGeo = new THREE.ShapeGeometry(seaShape);
    // Normalize ShapeGeometry UVs from world coordinates into smooth 0..1 water-tile space
    const uvAttr = seaGeo.attributes.uv;
    if (uvAttr) {
      for (let i = 0; i < uvAttr.count; i++) {
        uvAttr.setXY(i, uvAttr.getX(i) * 0.008, uvAttr.getY(i) * 0.008);
      }
      uvAttr.needsUpdate = true;
    }
    const seaWater = new Water(seaGeo, {
      textureWidth: 256,
      textureHeight: 256,
      waterNormals: engine.waterNormals,
      sunDirection: new THREE.Vector3(0.45, 0.75, 0.35).normalize(),
      sunColor: 0xbae6fd,
      waterColor: 0x0369a1,
      distortionScale: 1.8,
      alpha: 0.68,
      fog: true
    });
    if (seaWater.material && seaWater.material.uniforms && seaWater.material.uniforms['size']) {
      seaWater.material.uniforms['size'].value = 9.0;
    }
    seaWater.rotation.x = -Math.PI / 2;
    seaWater.position.y = 0.01;
    seaWater.visible = !lowQ;
    scene.add(seaWater);
    engine.seaWater = seaWater;

    // Deep Arabian Gulf seabed under semi-transparent Water ripples (also serves as Low quality sea)
    const simpleSea = new THREE.Mesh(
      seaGeo,
      new THREE.MeshStandardMaterial({ color: '#075985', roughness: 0.35, metalness: 0.25 })
    );
    simpleSea.rotation.x = -Math.PI / 2;
    simpleSea.position.y = -0.04;
    simpleSea.visible = true;
    scene.add(simpleSea);
    engine.simpleSea = simpleSea;

    // Sandy beach / seawall promenade along coastline
    const shoreCurve = new THREE.CatmullRomCurve3(coastPts.map(([cx, cz]) => new THREE.Vector3(cx, 0.06, cz)));
    const shoreMesh = new THREE.Mesh(
      new THREE.TubeGeometry(shoreCurve, 48, 0.95, 7, false),
      new THREE.MeshStandardMaterial({ color: '#C8B088', roughness: 0.88 })
    );
    shoreMesh.receiveShadow = true;
    scene.add(shoreMesh);
  }

  // Procedural window textures (day & lit evening)
  engine.dayWinTex = createBuildingWindowTexture(false);
  engine.eveWinTex = createBuildingWindowTexture(true);

  // Build Sectors, Roads, Parks, Buildings & Trees
  buildStaticEnvironment(state, lowQ);

  // Build Detailed DESAL-01 Coastal Desalination Plant
  buildDesalinationPlant(state);

  // Build Detailed RES-01 Look-Inside Reservoir Tank
  buildReservoirLookInside(state);

  // Build Metallic Pipes with Flanges & Flow Particle Pool
  buildPipesAndParticles(state, lowQ);

  // Build Detailed Valve Bodies with Handwheels
  buildValves(state);

  // Build Sensors
  buildSensors(state);

  // Build Legend (3 pipe classes, reducer, junction, valves, flow arrow, leak statuses, sectors, tank rings)
  const legendBody = document.getElementById('ag-legend-body');
  legendBody.innerHTML =
  `<div style="margin-bottom:4px; padding-bottom:4px; border-bottom:1px solid #334155;">
    <div style="font-weight:700; color:#94A3B8; margin-bottom:2px;">Pipe Classes (3)</div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#1D4ED8; height:7px; width:14px;"></span><span><strong>Trunk Main</strong> (900 mm)</span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#2563EB; height:5px; width:14px;"></span><span><strong>Sector Trunk</strong> (500 mm)</span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#38BDF8; height:3px; width:14px;"></span><span><strong>Distribution</strong> (200 mm)</span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#CBD5E1; clip-path:polygon(0 20%,100% 0,100% 100%,0 80%); width:12px;"></span><span>Reducer (diameter change)</span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#E2E8F0; border-radius:2px;"></span><span>Junction Fitting (T / Cross)</span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#E0F2FE; clip-path:polygon(0 20%,65% 20%,65% 0,100% 50%,65% 100%,65% 80%,0 80%); width:12px;"></span><span>Flow Arrow (from &rarr; to)</span></div>
  </div>
  <div style="margin-bottom:4px; padding-bottom:4px; border-bottom:1px solid #334155;">
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#22C55E; border-radius:50%;"></span><span>Valve OPEN · <span style="color:#EF4444;">●</span> CLOSED</span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#EF4444; border-radius:50%;"></span><span>Leak: <span style="color:#FCA5A5;">CONFIRMED</span> · <span style="color:#FDBA74;">SUSPECTED</span> · <span style="color:#FDE047;">REPAIR</span></span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#38BDF8; border-radius:50%;"></span><span>Sensor · ⚠ Quarantined</span></div>
    <div class="ag-leg-row"><span class="ag-swatch" style="background:#FFFFFF;"></span><span>Tank Rings: Cur · <span style="color:#FACC15;">+5%</span> · <span style="color:#F97316;">Dyn</span> · <span style="color:#EF4444;">35%</span></span></div>
  </div>
  <div style="font-weight:700; color:#94A3B8; margin-bottom:2px;">Sector Ground Zones</div>` +
  (state.sectors || []).map(s =>
    `<div class="ag-leg-row"><span class="ag-swatch" style="background:${s.color}55; border:2px solid ${s.color};"></span><span><strong>${s.name}</strong> (${s.color_name})</span></div>`
  ).join('');

  // Hover Raycaster Tooltips + Interactive Click Selection (updates caption & fills chat input!)
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2(-99, -99);
  const tooltipEl = document.getElementById('ag-tooltip');
  let downX = 0, downY = 0;
  let clickSeq = 0;

  function fillParentChatInput(suggestionText) {
    if (!suggestionText) return;
    try {
      const parentDoc = window.parent && window.parent.document;
      if (!parentDoc) return;
      const ta = parentDoc.querySelector('[data-testid="stChatInputTextArea"], textarea[aria-label*="Ask AquaGrid"]');
      if (!ta) return;
      const nativeSetter = Object.getOwnPropertyDescriptor(window.parent.HTMLTextAreaElement.prototype, 'value')?.set
        || Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value')?.set;
      if (nativeSetter) {
        nativeSetter.call(ta, suggestionText);
      } else {
        ta.value = suggestionText;
      }
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      ta.focus();
    } catch (e) {
      // Cross-origin fallback handled cleanly in Python via component return value
    }
  }

  renderer.domElement.addEventListener('pointerdown', (ev) => {
    downX = ev.clientX;
    downY = ev.clientY;
  });

  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (ev.button !== 0) return;
    if (Math.hypot(ev.clientX - downX, ev.clientY - downY) > 6) return;
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(engine.hoverables, false);
    if (!hits.length) return;
    // Prioritize leaks -> valves -> plant/reservoir -> sectors
    const prio = { leak: 0, valve: 1, plant: 2, reservoir: 2, sector: 3 };
    let chosen = null;
    for (const h of hits) {
      const info = h.object.userData && h.object.userData.selectInfo;
      if (!info) continue;
      if (!chosen || (prio[info.target_type] ?? 9) < (prio[chosen.target_type] ?? 9)) {
        chosen = info;
      }
    }
    if (chosen) {
      clickSeq += 1;
      showEventToast(`Selected ${chosen.target_id} — press Enter in chat`);
      fillParentChatInput(chosen.suggestion);
      sendToStreamlit("streamlit:setComponentValue", {
        value: {
          kind: "select",
          target_type: chosen.target_type,
          target_id: chosen.target_id,
          focus: chosen.focus,
          suggestion: chosen.suggestion,
          click_seq: clickSeq
        }
      });
    }
  });

  function setHoveredRun(nextRunId) {
    if (engine.hoveredRunId === nextRunId) return;
    if (engine.hoveredRunId && engine.pipesByRun[engine.hoveredRunId]) {
      engine.pipesByRun[engine.hoveredRunId].forEach(tr => {
        tr.mat.emissive.copy(tr.baseEmissive);
        tr.mat.emissiveIntensity = tr.baseEmissiveIntensity;
        tr.mat.opacity = tr.baseOpacity;
      });
    }
    engine.hoveredRunId = nextRunId;
    if (nextRunId && engine.pipesByRun[nextRunId]) {
      const hoverGlow = new THREE.Color('#38BDF8');
      engine.pipesByRun[nextRunId].forEach(tr => {
        tr.mat.emissive.copy(hoverGlow);
        tr.mat.emissiveIntensity = 0.85;
        tr.mat.opacity = 1.0;
      });
    }
  }

  renderer.domElement.addEventListener('pointermove', (ev) => {
    const rect = renderer.domElement.getBoundingClientRect();
    pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hits = raycaster.intersectObjects(engine.hoverables, false);
    if (hits.length > 0 && hits[0].object.userData.tooltip) {
      const topObj = hits[0].object;
      setHoveredRun(topObj.userData.pipeRunId || null);
      tooltipEl.innerHTML = topObj.userData.tooltip;
      tooltipEl.style.display = 'block';
      tooltipEl.style.left = Math.min(rect.width - 275, Math.max(8, ev.clientX - rect.left + 12)) + 'px';
      tooltipEl.style.top = Math.min(rect.height - 110, Math.max(8, ev.clientY - rect.top + 12)) + 'px';
      renderer.domElement.style.cursor = hits.some(h => h.object.userData.selectInfo) ? 'pointer' : 'grab';
    } else {
      setHoveredRun(null);
      tooltipEl.style.display = 'none';
      renderer.domElement.style.cursor = 'grab';
    }
  });
  renderer.domElement.addEventListener('pointerleave', () => {
    setHoveredRun(null);
    tooltipEl.style.display = 'none';
  });

  // Cancel active camera fly-to if the user manually grabs the camera
  controls.addEventListener('start', () => { engine.flyAnim = null; });

  window.addEventListener('resize', () => {
    const w = container.clientWidth || 800;
    const h = container.clientHeight || 450;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  engine.initialized = true;
  startAnimationLoop();
}

function buildStaticEnvironment(state, lowQ) {
  const S = engine.scale;
  const scene = engine.scene;

  // 1. Sector zones + fire emergency beacons
  (state.sectors || []).forEach(sec => {
    const poly = sec.polygon_xz || [];
    if (poly.length < 3) return;
    const shape = new THREE.Shape();
    shape.moveTo(poly[0][0] * S, -poly[0][1] * S);
    for (let i = 1; i < poly.length; i++) shape.lineTo(poly[i][0] * S, -poly[i][1] * S);
    shape.closePath();

    const zoneMat = new THREE.MeshBasicMaterial({
      color: sec.color,
      transparent: true,
      opacity: 0.16,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const zoneMesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), zoneMat);
    zoneMesh.rotation.x = -Math.PI / 2;
    zoneMesh.position.y = 0.05;
    zoneMesh.userData.selectInfo = {
      target_type: 'sector',
      target_id: sec.name,
      focus: sec.name,
      suggestion: `Tell me about ${sec.name}`
    };
    scene.add(zoneMesh);
    engine.hoverables.push(zoneMesh);

    const borderPts = poly.map(p => new THREE.Vector3(p[0] * S, 0.14, p[1] * S));
    const borderMat = new THREE.LineBasicMaterial({ color: sec.color, transparent: true, opacity: 0.92 });
    const borderLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(borderPts), borderMat);
    scene.add(borderLine);

    const cx = sec.centroid_xz[0] * S;
    const cz = sec.centroid_xz[1] * S;
    const lblRec = registerLabel(sec.name, new THREE.Vector3(cx, 7.0, cz), 'ag-label', sec.color);

    // Fire Emergency Marker (shown in Sector 6 during U-5.2)
    const fireGroup = new THREE.Group();
    fireGroup.position.set(cx + 2.2, 1.5, cz - 1.5);
    const flameOuter = new THREE.Mesh(
      new THREE.ConeGeometry(1.4, 3.6, 12),
      new THREE.MeshStandardMaterial({ color: '#F97316', emissive: '#EA580C', emissiveIntensity: 1.2, transparent: true, opacity: 0.9 })
    );
    flameOuter.position.y = 1.8;
    const flameInner = new THREE.Mesh(
      new THREE.ConeGeometry(0.75, 2.3, 10),
      new THREE.MeshBasicMaterial({ color: '#FEF08A' })
    );
    flameInner.position.y = 1.2;
    fireGroup.add(flameOuter, flameInner);
    fireGroup.visible = false;
    scene.add(fireGroup);
    const fireLbl = registerLabel('🔥 FIRE EMERGENCY (S6)', new THREE.Vector3(cx + 2.2, 6.2, cz - 1.5), 'ag-label ag-label-danger');
    fireLbl.visible = false;
    fireLbl.el.style.display = 'none';

    engine.sectorMap[sec.name] = {
      zoneMesh, zoneMat, borderLine, borderMat, lblRec, fireGroup, fireLbl,
      baseColor: new THREE.Color(sec.color),
      nonCompliant: false,
      hasFire: false
    };
  });

  // 2. Roads between blocks & community parks
  const roadMat = new THREE.MeshStandardMaterial({ color: '#1E293B', roughness: 0.95 });
  (state.roads || []).forEach(rd => {
    const x1 = rd.start_xz[0] * S, z1 = rd.start_xz[1] * S;
    const x2 = rd.end_xz[0] * S, z2 = rd.end_xz[1] * S;
    const len = Math.hypot(x2 - x1, z2 - z1);
    if (len < 0.5) return;
    const rMesh = new THREE.Mesh(new THREE.BoxGeometry(len, 0.06, Math.max(0.45, (rd.width_m || 60) * S)), roadMat);
    rMesh.position.set((x1 + x2) * 0.5, 0.02, (z1 + z2) * 0.5);
    rMesh.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
    rMesh.receiveShadow = true;
    scene.add(rMesh);
  });

  const parkMat = new THREE.MeshStandardMaterial({ color: '#14532D', roughness: 0.95 });
  (state.parks || []).forEach(pk => {
    const pMesh = new THREE.Mesh(new THREE.CircleGeometry(Math.max(1.5, pk.radius_m * S), 18), parkMat);
    pMesh.rotation.x = -Math.PI / 2;
    pMesh.position.set(pk.x * S, 0.04, pk.z * S);
    pMesh.receiveShadow = true;
    scene.add(pMesh);
  });

  // 3. Instanced Procedural Buildings & Trees
  rebuildCityInstances(state, lowQ);
}

function rebuildCityInstances(state, lowQ) {
  const S = engine.scale;
  const scene = engine.scene;
  if (engine.buildingInst) { scene.remove(engine.buildingInst); engine.buildingInst.dispose(); engine.buildingInst = null; }
  if (engine.treeTrunksInst) { scene.remove(engine.treeTrunksInst); engine.treeTrunksInst.dispose(); engine.treeTrunksInst = null; }
  if (engine.treeCrownsInst) { scene.remove(engine.treeCrownsInst); engine.treeCrownsInst.dispose(); engine.treeCrownsInst = null; }

  const isEvening = (state.current_hour >= 18 || state.current_hour < 6);
  const buildings = state.buildings || [];
  if (buildings.length > 0) {
    const bMat = new THREE.MeshStandardMaterial({
      map: isEvening ? engine.eveWinTex : engine.dayWinTex,
      emissive: isEvening ? new THREE.Color('#F59E0B') : new THREE.Color('#000000'),
      emissiveMap: isEvening ? engine.eveWinTex : null,
      emissiveIntensity: isEvening ? 0.55 : 0.0,
      roughness: 0.62,
      metalness: 0.25
    });
    const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), bMat, buildings.length);
    inst.castShadow = !lowQ;
    inst.receiveShadow = true;
    const dummy = new THREE.Object3D();
    const tmpCol = new THREE.Color();
    buildings.forEach((b, idx) => {
      const w = Math.max(0.8, b.w * S);
      const d = Math.max(0.8, b.d * S);
      const h = Math.max(0.9, b.h * S);
      dummy.position.set(b.x * S, h * 0.5, b.z * S);
      dummy.scale.set(w, h, d);
      dummy.updateMatrix();
      inst.setMatrixAt(idx, dummy.matrix);
      tmpCol.set(b.base_hex || '#475569').lerp(new THREE.Color(b.color || '#64748B'), 0.22);
      inst.setColorAt(idx, tmpCol);
    });
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    scene.add(inst);
    engine.buildingInst = inst;
    engine.buildingMat = bMat;
  }

  const trees = state.trees || [];
  if (trees.length > 0) {
    const trunks = new THREE.InstancedMesh(
      new THREE.CylinderGeometry(0.12, 0.16, 0.7, 6),
      new THREE.MeshStandardMaterial({ color: '#78350F', roughness: 0.95 }),
      trees.length
    );
    const crowns = new THREE.InstancedMesh(
      new THREE.ConeGeometry(0.65, 1.5, 7),
      new THREE.MeshStandardMaterial({ color: '#15803D', roughness: 0.85 }),
      trees.length
    );
    const dummy = new THREE.Object3D();
    trees.forEach((tr, idx) => {
      const sc = tr.scale || 1.0;
      dummy.position.set(tr.x * S, 0.35 * sc, tr.z * S);
      dummy.scale.setScalar(sc);
      dummy.updateMatrix();
      trunks.setMatrixAt(idx, dummy.matrix);

      dummy.position.set(tr.x * S, 1.35 * sc, tr.z * S);
      dummy.updateMatrix();
      crowns.setMatrixAt(idx, dummy.matrix);
    });
    trunks.instanceMatrix.needsUpdate = true;
    crowns.instanceMatrix.needsUpdate = true;
    scene.add(trunks, crowns);
    engine.treeTrunksInst = trunks;
    engine.treeCrownsInst = crowns;
  }

  engine.staticCityBuiltQuality = lowQ ? 'Low' : 'High';
  engine.lastHourEvening = isEvening;
}

function buildDesalinationPlant(state) {
  const S = engine.scale;
  const pl = state.plant || { id: 'DESAL-01', pos_xz: [-13000, 11000], output_mld: 100, max_capacity_mld: 120, algae_cap_mld: 120, intakes: [] };

  const g = new THREE.Group();
  g.position.set(px, 0, pz);

  // Concrete coastal pad

    new THREE.BoxGeometry(15.5, 0.35, 11.5),

  const intake2Mat = new THREE.MeshStandardMaterial({ color: '#0284C7', roughness: 0.3, metalness: 0.55 });

  intake2.position.set(-7.6, 0.65, 2.0);
  intake2.userData.tooltip = '<strong>Intake 2 (DESAL-01)</strong><br/>Status: ACTIVE';

  engine.hoverables.push(intake2);

  // Green algae plume patch around Intake 2 (visible during algal bloom!)

    new THREE.CircleGeometry(3.2, 20),
    new THREE.MeshBasicMaterial({ color: '#16A34A', transparent: true, opacity: 0.58, side: THREE.DoubleSide })
  );
  algaePlume.rotation.x = -Math.PI / 2;
  algaePlume.position.set(-10.5, 0.12, 2.0);

  // Brine outfall pipe back to sea (south side)

    new THREE.CylinderGeometry(0.28, 0.28, 8.8, 10),
    new THREE.MeshStandardMaterial({ color: '#64748B', roughness: 0.45, metalness: 0.6 })
  );

  outfall.position.set(-7.4, 0.42, 4.4);

  g.add(outfall);
  engine.hoverables.push(outfall);

  // 2. Pre-treatment Clarifier Tanks
  const pretreatMat = new THREE.MeshStandardMaterial({ color: '#64748B', roughness: 0.55, metalness: 0.25 });
  [-2.2, 1.8].forEach(zOff => {
    const tank = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 2.0, 20), pretreatMat);
    tank.position.set(-3.6, 1.2, zOff);
    tank.castShadow = true;
    tank.userData.tooltip = '<strong>Pre-treatment Tanks</strong><br/>Ultrafiltration &amp; media clarifiers.';
    g.add(tank);
    engine.hoverables.push(tank);
    const waterTop = new THREE.Mesh(
      new THREE.CircleGeometry(1.42, 18),
      new THREE.MeshStandardMaterial({ color: '#0EA5E9', roughness: 0.2, metalness: 0.2 })
    );

    waterTop.position.set(-3.6, 2.22, zOff);

    color: '#93C5FD',
    transparent: true,
    opacity: 0.28,

    metalness: 0.1,

  // 4. High-Pressure Pumps (rotating glowing pump skids; speed scales with MLD!)

  engine.hoverables.push(subBody);
  [-0.6, 0.0, 0.6].forEach(xOff => {
    const ins = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 1.0, 8), new THREE.MeshStandardMaterial({ color: '#F59E0B', emissive: '#B45309', emissiveIntensity: 0.4 }));
    ins.position.set(5.2 + xOff, 2.4, 3.9);
    g.add(ins);
  });

  // 6. Output gauge bar on roof of RO hall
  const gaugeBg = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.55, 0.8), new THREE.MeshStandardMaterial({ color: '#0F172A' }));
  gaugeBg.position.set(1.0, 3.65, -0.3);
  g.add(gaugeBg);
  const gaugeMat = new THREE.MeshStandardMaterial({ color: '#38BDF8', emissive: '#0284C7', emissiveIntensity: 0.9 });
  const gaugeBar = new THREE.Mesh(new THREE.BoxGeometry(5.0, 0.6, 0.86), gaugeMat);
  gaugeBar.position.set(1.0, 3.65, -0.3);
  g.add(gaugeBar);

  engine.scene.add(g);

  // Floating part labels
  const mainLbl = registerLabel(pl.label || `DESAL-01 — ${pl.output_mld} MLD`, new THREE.Vector3(px + 1.0, 5.6, pz - 0.3), 'ag-label', '#38BDF8');

  const int2Lbl = registerLabel('Intake 2', new THREE.Vector3(px - 8.5, 2.0, pz + 2.0), 'ag-label ag-label-part');

  };
}

function buildReservoirLookInside(state) {
  const S = engine.scale;
  const res = state.reservoir || { id: 'RES-01', pos_xz: [-11000, 8800], level_percent: 48, base_floor_percent: 35, safety_floor_percent: 35, warning_floor_percent: 40 };
  const rx = res.pos_xz[0] * S, rz = res.pos_xz[1] * S;
  const R = 5.4, H = 8.0;
  const g = new THREE.Group();
  g.position.set(rx, 0, rz);

  // Concrete base slab
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(R + 0.5, R + 0.65, 0.45, 36),
    new THREE.MeshStandardMaterial({ color: '#475569', roughness: 0.85 })
  );
  base.position.y = 0.22;
  base.receiveShadow = true;
  g.add(base);

  // Back concrete structural half-shell (220 deg) + Front glass cutaway window (140 deg) so operator sees right inside!
  const concreteWall = new THREE.Mesh(
    new THREE.CylinderGeometry(R, R, H, 32, 1, true, Math.PI * 0.72, Math.PI * 1.28),
    new THREE.MeshStandardMaterial({ color: '#64748B', roughness: 0.78, metalness: 0.1, side: THREE.DoubleSide })
  );
  concreteWall.position.y = H * 0.5 + 0.4;
  concreteWall.castShadow = true;
  concreteWall.receiveShadow = true;
  g.add(concreteWall);

  const glassMat = new THREE.MeshPhysicalMaterial({
    color: '#E0F2FE',
    transparent: true,
    opacity: 0.22,
    transmission: 0.78,
    roughness: 0.08,
    metalness: 0.05,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const glassWall = new THREE.Mesh(
    new THREE.CylinderGeometry(R, R, H, 28, 1, true, -Math.PI * 0.28, Math.PI * 1.0),
    glassMat
  );
  glassWall.position.y = H * 0.5 + 0.4;
  glassWall.userData.tooltip = `<strong>RES-01 Strategic Reservoir</strong><br/>Level: ${res.level_percent}%`;
  g.add(glassWall);
  engine.hoverables.push(glassWall);

  // Concrete top rim ring
  const topRim = new THREE.Mesh(
    new THREE.TorusGeometry(R, 0.22, 10, 40),
    new THREE.MeshStandardMaterial({ color: '#94A3B8', roughness: 0.6, metalness: 0.25 })
  );
  topRim.rotation.x = Math.PI / 2;
  topRim.position.y = H + 0.4;
  g.add(topRim);

  // Animated water volume inside tank (unit height scaled dynamically on Y)
  const waterMat = new THREE.MeshPhysicalMaterial({
    color: '#0EA5E9',
    emissive: '#0369A1',
    emissiveIntensity: 0.35,
    transparent: true,
    opacity: 0.82,
    roughness: 0.14,
    metalness: 0.08
  });
  const waterBody = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.26, R - 0.26, 1.0, 32), waterMat);
  g.add(waterBody);

  // Rippling water surface disc on top of water column
  const surfMat = new THREE.MeshStandardMaterial({
    color: '#7DD3FC',
    emissive: '#0284C7',
    emissiveIntensity: 0.5,
    roughness: 0.15,
    metalness: 0.25,
    transparent: true,
    opacity: 0.85
  });
  const waterSurface = new THREE.Mesh(new THREE.CircleGeometry(R - 0.24, 32), surfMat);
  waterSurface.rotation.x = -Math.PI / 2;
  g.add(waterSurface);

  // 4 Inner-Wall Level Marker Rings:
  // 1) Current level (white), 2) Safety floor 35% (red), 3) Dynamic floor (orange), 4) Floor + 5% warning (yellow)
  const makeRing = (hex, radOffset = -0.18, thick = 0.09) => {
    const m = new THREE.Mesh(
      new THREE.TorusGeometry(R + radOffset, thick, 8, 40),
      new THREE.MeshBasicMaterial({ color: hex })
    );
    m.rotation.x = Math.PI / 2;
    g.add(m);
    return m;
  };
  const currentRing = makeRing('#FFFFFF', -0.16, 0.11);
  const baseFloorRing = makeRing('#EF4444', -0.15, 0.12);     // 35% red
  const dynamicFloorRing = makeRing('#F97316', -0.13, 0.13);  // dynamic floor orange (fire emergency)
  const warningFloorRing = makeRing('#FACC15', -0.15, 0.09);  // floor + 5% yellow

  // Inlet pipe from DESAL-01 (entering upper side inside tank) + Outlet pipes to city (bottom east side)
  const inletPipe = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.32, 4.0, 10),
    new THREE.MeshStandardMaterial({ color: '#38BDF8', metalness: 0.65, roughness: 0.25 })
  );
  inletPipe.rotation.z = Math.PI / 2;
  inletPipe.position.set(-R + 1.2, H * 0.78 + 0.4, 0);
  inletPipe.userData.tooltip = '<strong>RES-01 Inlet Pipe</strong><br/>Product water entering from DESAL-01.';

  [-1.2, 1.2].forEach((zOff, idx) => {
